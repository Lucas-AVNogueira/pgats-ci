trigger:
  - master
  - main

pool:
  vmImage: 'ubuntu-latest'

steps:
# 1. Instalar explicitamente o Node.js 20 usando a tarefa nativa corrigida
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Instalar Node.js 20'

# 2. Instalar dependências de forma limpa usando npm
- script: |
    node -v
    npm ci || npm install
  displayName: 'Instalar Dependências (NPM)'

# 3. Executar Testes Unitários
- script: npm run test || yarn test
  displayName: 'Executar Testes Unitários'

# 4. Executar Testes de Mutação (Stryker)
- script: npm run test:mutation || yarn test:mutation
  displayName: 'Executar Testes de Mutação'

# 5. Instalar navegadores necessários para o Playwright
- script: npx playwright install --with-deps
  displayName: 'Instalar Navegadores do Playwright'

# 6. Executar Testes End-to-End
- script: npm run e2e || yarn e2e
  displayName: 'Executar Testes E2E (Playwright)'

# 7. Recolher e guardar os relatórios gerados
- task: PublishPipelineArtifact@1
  inputs:
    targetPath: '$(System.DefaultWorkingDirectory)/reports'
    artifact: 'Relatorios-Testes'
  displayName: 'Publicar Relatórios de Cobertura e Mutação'

