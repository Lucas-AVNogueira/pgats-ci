# CI de Nivel 01 - Disparo Manual através de clique

# nome da pipeline
name:'Execução Manual'

# gatilhos / triggers - regras de disparo
# gartilho manual = workflow dispatch

on:
    workflow_dispatch:

# tarefas dentro da pipeline = jobs

jobs:
     
     # nome do job
     e2e-tests:
       # maquina onde o job vai rodar
       runs-on: ubuntu-latest

      # passos do job
      steps:
          #  clone do projeto
          - uses: actions/checkout@v4

          # instalação do node
          - uses: actions/setup-node@v4
            with:
              node-version: 24.x

          # instalação do Yarn
          - name: instalando  Yarn
            run: npm install - g yarn
        # instalação das dependências
          - name: instalando  dependências
            run: yarn
        
        # instalação dos Browsers do Playwright
          - name: instalando Browsers 
            run: yarn playwright install
            
            # executar os testes e2e
          - name: Executando testes e2e
            run: yarn run e2e